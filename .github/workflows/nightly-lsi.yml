name: Nightly LSI Deploy

on:
  schedule:
    - cron: "0 3 * * *" # Every night at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2" # Latest patch has builds for current Ubuntu runners.
          bundler-cache: true
      - name: Checkout football database
        uses: actions/checkout@v4
        with:
          repository: seanelvidge/England-football-results
          path: .football-source
          persist-credentials: false
      - name: Setup Node for football records
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Generate football records from the results CSVs
        run: |
          npm ci
          node scripts/generate_team_pages.js --data-dir .football-source
          node scripts/generate_rivalry_snapshots.js --refresh
          node --test scripts/rivalry_snapshots.test.js scripts/football_win_history.test.js scripts/team_pages.test.js
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: ${{ github.repository }}
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Install and Build (LSI) 🔧
        run: |
          pip3 install --upgrade jupyter
          export JEKYLL_ENV=production
          bundle exec jekyll build --lsi
      - name: Verify generated football pages
        run: |
          bundle exec ruby scripts/check_team_pages.rb _site
          bundle exec ruby scripts/check_rivalry_pages.rb _site
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
